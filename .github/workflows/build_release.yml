name: Build Release Artifact

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pull upstream 🌏
        uses: actions/checkout@v4
        with:
          repository: YumemiProject/Yumemi
          ref: devel
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Automation Scripts 🛠️
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: automation_scripts
          ref: global

      - name: Customize App (Version, Logo & Splash) 🎨
        run: |
          echo "🎨 Applying Customizations..."
          
          # 0. Inject Gemini Features
          if [ -f "automation_scripts/automation_scripts/inject_features.sh" ]; then
             chmod +x automation_scripts/automation_scripts/inject_features.sh
             ./automation_scripts/automation_scripts/inject_features.sh
          elif [ -f "automation_scripts/inject_features.sh" ]; then
             # Depending on checkout path
             chmod +x automation_scripts/inject_features.sh
             ./automation_scripts/inject_features.sh
          else
             echo "⚠️ Feature injection script not found"
          fi

          # 1. Update Version to 1.0 and Java/Kotlin target to 17
          sed -i "s/sourceCompatibility JavaVersion.VERSION_11/sourceCompatibility JavaVersion.VERSION_17/" app/build.gradle
          sed -i "s/targetCompatibility JavaVersion.VERSION_11/targetCompatibility JavaVersion.VERSION_17/" app/build.gradle
          sed -i "s/jvmTarget = JavaVersion.VERSION_11.toString()/jvmTarget = JavaVersion.VERSION_17.toString()/" app/build.gradle
          sed -i "s/versionName = '.*'/versionName = '1.0'/" app/build.gradle
          echo "✅ Version updated to 1.0 and JVM target set to 17"
          
          # 2. Update Logo (Fixing stretching and blurriness/zoom-out)
          sudo apt-get update -y && sudo apt-get install -y webp imagemagick
          
          declare -A sizes=( ["mdpi"]=48 ["hdpi"]=72 ["xhdpi"]=96 ["xxhdpi"]=144 ["xxxhdpi"]=192 )
          SOURCE_LOGO="automation_scripts/assets/ic_launcher.png"
          
          if [ -f "$SOURCE_LOGO" ]; then
            for density in "${!sizes[@]}"; do
              size=${sizes[$density]}
              target_dir="app/src/main/res/mipmap-$density"
              if [ -d "$target_dir" ]; then
                 echo "   -> Processing logo for $density ($size px)..."
                 # Zoom out effect: Resize logo to 75% of the target size and center it
                 inner_size=$((size * 75 / 100))
                 convert "$SOURCE_LOGO" -background none -thumbnail "${inner_size}x${inner_size}" -gravity center -extent "${size}x${size}" -quality 100 -define webp:lossless=true "$target_dir/ic_launcher.webp"
                 cp "$target_dir/ic_launcher.webp" "$target_dir/ic_launcher_round.webp"
                 cp "$target_dir/ic_launcher.webp" "$target_dir/ic_launcher_foreground.webp"
              fi
            done
            echo "✅ Logo updated (zoomed out & sharp)"
          else
            echo "⚠️ Custom logo not found at $SOURCE_LOGO"
          fi

          # 3. Update Loading Screen (Splash) - Fixing stretching
          SOURCE_SPLASH="automation_scripts/assets/loading.png"
          if [ -f "$SOURCE_SPLASH" ]; then
            echo "   -> Applying custom loading image..."
            # Process the loading image into a 512x512 square to prevent stretching in Splash API
            convert "$SOURCE_SPLASH" -background none -thumbnail "512x512" -gravity center -extent "512x512" app/src/main/res/drawable/loading_custom.png
            
            # Update themes to use the new splash icon
            find app/src/main/res/values* -name "themes.xml" -exec sed -i 's/@drawable\/avd_splash/@drawable\/loading_custom/g' {} +
            echo "✅ Loading screen updated (no stretching)"
          else
            echo "⚠️ Custom loading image not found at $SOURCE_SPLASH"
          fi

      - name: Set up JDK 🚀
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 🚀
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK 🚀
        uses: android-actions/setup-android@v3

      - name: Setup Signing Key 🔐
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using Release Keystore from secrets"
            echo "$KEYSTORE_BASE64" | base64 --decode > signing.jks
            echo "store_file=$(pwd)/signing.jks" >> $GITHUB_OUTPUT
            echo "store_password=$KEYSTORE_PASSWORD" >> $GITHUB_OUTPUT
            echo "key_alias=$KEY_ALIAS" >> $GITHUB_OUTPUT
            echo "key_password=$KEY_PASSWORD" >> $GITHUB_OUTPUT
          else
            echo "Using Debug Keystore (Fallback)"
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "store_file=$(pwd)/debug.keystore" >> $GITHUB_OUTPUT
            echo "store_password=android" >> $GITHUB_OUTPUT
            echo "key_alias=androiddebugkey" >> $GITHUB_OUTPUT
            echo "key_password=android" >> $GITHUB_OUTPUT
          fi

      - name: Build Release APK (Attempt 1) 💻
        id: build_attempt_1
        run: |
          chmod +x gradlew
          ./gradlew -Pandroid.injected.signing.store.file=${{ steps.sign.outputs.store_file }} -Pandroid.injected.signing.store.password=${{ steps.sign.outputs.store_password }} -Pandroid.injected.signing.key.alias=${{ steps.sign.outputs.key_alias }} -Pandroid.injected.signing.key.password=${{ steps.sign.outputs.key_password }} -Dtg_backup_bot_token=$(curl -s https://dragonx943.github.io/waydroid_x86_64/value.json) -Dgh_username=${{ github.repository_owner }} -DparsersVersionOverride=$(curl -s https://api.github.com/repos/YakaTeam/kotatsu-parsers/commits/master -H "Accept: application/vnd.github.sha" | cut -c -10) assembleRelease
        continue-on-error: true

      - name: Auto-Fix Build (Attempt 2 - Clean & Retry) 🔧
        if: steps.build_attempt_1.outcome == 'failure'
        run: |
          echo "⚠️ Build failed. Running auto-fix (clean)..."
          ./gradlew clean
          echo "🔄 Retrying build..."
          ./gradlew -Pandroid.injected.signing.store.file=${{ steps.sign.outputs.store_file }} -Pandroid.injected.signing.store.password=${{ steps.sign.outputs.store_password }} -Pandroid.injected.signing.key.alias=${{ steps.sign.outputs.key_alias }} -Pandroid.injected.signing.key.password=${{ steps.sign.outputs.key_password }} -Dtg_backup_bot_token=$(curl -s https://dragonx943.github.io/waydroid_x86_64/value.json) -Dgh_username=${{ github.repository_owner }} -DparsersVersionOverride=$(curl -s https://api.github.com/repos/YakaTeam/kotatsu-parsers/commits/master -H "Accept: application/vnd.github.sha" | cut -c -10) assembleRelease
        continue-on-error: true

      - name: Final Build Attempt (Attempt 3) 🚀
        if: failure()
        run: |
           echo "⚠️ Previous attempts failed. Trying one last time..."
           # Kill any lingering daemons
           pkill -f java || true
           ./gradlew -Pandroid.injected.signing.store.file=${{ steps.sign.outputs.store_file }} -Pandroid.injected.signing.store.password=${{ steps.sign.outputs.store_password }} -Pandroid.injected.signing.key.alias=${{ steps.sign.outputs.key_alias }} -Pandroid.injected.signing.key.password=${{ steps.sign.outputs.key_password }} -Dtg_backup_bot_token=$(curl -s https://dragonx943.github.io/waydroid_x86_64/value.json) -Dgh_username=${{ github.repository_owner }} -DparsersVersionOverride=$(curl -s https://api.github.com/repos/YakaTeam/kotatsu-parsers/commits/master -H "Accept: application/vnd.github.sha" | cut -c -10) assembleRelease

      - name: Upload APK artifact 📤
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact 📥
        uses: actions/download-artifact@v4
        with:
          name: release-apk

      - name: Generate package 📦
        id: release_info
        run: |
          echo "tag=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "formatted_date=$(date +'%Y/%m/%d')" >> $GITHUB_OUTPUT
          mv *.apk release.apk
          if [ -f "gemini_summary.md" ]; then
            cat gemini_summary.md >> release_notes.md
          fi
          echo "Automated Nullum build generated on $(date +'%Y/%m/%d')" >> release_notes.md

      - name: Upload to release 🌐
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "Nullum Build ${{ steps.release_info.outputs.tag }}"
          body_path: release_notes.md
          files: release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
